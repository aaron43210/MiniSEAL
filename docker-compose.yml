version: '3.8'

# LIVE services (Qwen-backed, runnable). The custom from-scratch .pt services
# (alignment, adaptation, gateway) are an OFFLINE learning track and are NOT
# started here -- see the note below and README "Track A".
services:
  tokenizer-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python services/tokenizer_service/app.py
    ports:
      - "8001:8001"
    volumes:
      - .:/workspace
    working_dir: /workspace

  # --- OFFLINE / from-scratch track (NOT started by `docker-compose up`) ---
  # alignment-service (:8002 /sft /dpo), adaptation-service (:8003 /adapt), and
  # api-gateway (:8080 pipeline) run the custom DecoderOnlyTransformer and need
  # trained .pt checkpoints produced on the DGX (gitignored, not in the repo).
  # They are kept in the repo as a learning track but excluded from the live
  # compose. To run one manually once a checkpoint exists:
  #   python src/alignment/alignment_service.py
  #   python src/adaptation/adaptation_service.py
  #   python src/api/gateway.py

  hitl-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python services/hitl_service/app.py
    ports:
      - "8006:8006"
    environment:
      - USE_CUDA=0
    volumes:
      - .:/workspace
    working_dir: /workspace
