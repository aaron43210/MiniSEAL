out_dir: "checkpoints/dgx_dpo_124M"
seed: 42
pretrained_model_path: "checkpoints/dgx_sft_124M/latest.pt"

tokenizer_path: "artifacts/tokenizer/tokenizer.json"
tokenizer_config: "artifacts/tokenizer/tokenizer_config.json"

dpo_data_path: "data/alignment/dpo.jsonl"

learning_rate: 1.0e-6  # DPO requires a much lower LR than SFT
min_lr: 1.0e-7
warmup_steps: 50
max_steps: 200

beta: 0.1 # DPO margin parameter

micro_batch_size: 2 # Reduced batch size due to 2x memory from active/ref models
grad_accum_steps: 8

weight_decay: 0.05
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

eval_interval: 50
eval_iters: 20
save_interval: 100
log_interval: 10

precision: "bf16"
num_workers: 2
