seed: 42
tokenizer_config: "artifacts/tokenizer/tokenizer_config.json"
tokenizer_path: "artifacts/tokenizer/tokenizer.json"

model:
  block_size: 1024
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.1
  bias: false
  multiple_of: 256
  norm_eps: 1.0e-5
  rope_theta: 10000.0

data:
  train_bin: "data/tokenized/train.bin"
  train_meta: "data/tokenized/train.meta.json"
  val_bin: "data/tokenized/val.bin"
  val_meta: "data/tokenized/val.meta.json"

train:
  out_dir: "ckpts/dgx_pretrain_124M"
  resume_from: "ckpts/dgx_pretrain_124M/latest.pt"
  precision: "bf16"
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 100
  max_steps: 50000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  micro_batch_size: 2
  grad_accum_steps: 64
  num_workers: 4
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 200
  eval_iters: 20
  save_interval: 1000
