out_dir: "model_weights/dgx_sft_rag"
seed: 42
pretrained_model_path: "Qwen/Qwen2.5-1.5B-Instruct"

tokenizer_path: "artifacts/tokenizer/tokenizer.json"
tokenizer_config: "artifacts/tokenizer/tokenizer_config.json"

sft_data_path: "data/alignment/sft.jsonl"

learning_rate: 3.0e-5
min_lr: 3.0e-6
warmup_steps: 10
max_steps: 100

micro_batch_size: 4
grad_accum_steps: 4

weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

eval_interval: 50
eval_iters: 10
save_interval: 100
log_interval: 10

precision: "bf16"
num_workers: 2
