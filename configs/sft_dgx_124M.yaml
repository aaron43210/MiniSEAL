out_dir: "ckpts/dgx_sft_124M"
seed: 42
pretrained_model_path: "ckpts/dgx_pretrain_124M/latest.pt"

tokenizer_path: "artifacts/tokenizer/tokenizer.json"
tokenizer_config: "artifacts/tokenizer/tokenizer_config.json"

sft_data_path: "data/alignment/sft.jsonl"

learning_rate: 2.0e-5
min_lr: 1.0e-6
warmup_steps: 100
max_steps: 500

micro_batch_size: 4
grad_accum_steps: 4

weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

eval_interval: 100
eval_iters: 50
save_interval: 200
log_interval: 10

precision: "bf16"
num_workers: 2
