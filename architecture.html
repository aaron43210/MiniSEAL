<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Self-Owned LLM Atlas</title>
<meta name="description" content="End-to-end interactive architecture map of the self_owned_llm capstone: pretrain, SFT, DPO, SEAL, HITL and serving."/>
<style>
:root{
  --canvas:#020617; --mask:#0F172A; --panel:#0b1324; --ink:#FFFFFF; --muted:#94A3B8;
  --dim:#475569; --border:#1E293B; --wire:#243049;
  --fn:#22D3EE; --model:#34D399; --data:#A78BFA; --gate:#FB7185; --service:#FBBF24;
  --db:#FB923C; --ext:#64748B; --note:#38BDF8;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --canvas:#eef2f8; --mask:#ffffff; --panel:#ffffff; --ink:#0b1220; --muted:#475569;
  --dim:#94A3B8; --border:#d7dee9; --wire:#c3cedf;
  --fn:#0891B2; --model:#059669; --data:#7C3AED; --gate:#E11D48; --service:#B45309;
  --db:#C2410C; --ext:#64748B; --note:#0369A1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 20px;border-bottom:1px solid var(--border);background:var(--mask);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.sigil{width:30px;height:30px;border-radius:7px;flex:0 0 auto;
  background:conic-gradient(from 210deg,var(--fn),var(--model),var(--data),var(--gate),var(--fn));
  box-shadow:0 0 0 1px var(--border),0 0 18px rgba(34,211,238,.25)}
header h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em}
header .sub{margin:2px 0 0;font-size:11px;color:var(--muted);font-weight:400}
#themeBtn{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--panel);
  border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
#themeBtn:hover{border-color:var(--fn)}
#tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px;border-bottom:1px solid var(--border);
  background:var(--mask);position:sticky;top:63px;z-index:30}
.tab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:999px;
  padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:7px}
.tab .dot{width:7px;height:7px;border-radius:50%}
.tab:hover{color:var(--ink);border-color:var(--dim)}
.tab.active{color:var(--canvas);background:var(--ink);border-color:var(--ink)}
:root[data-theme="light"] .tab.active{color:#fff;background:#0b1220}
main{display:grid;grid-template-columns:1fr 360px;gap:0;align-items:stretch}
#stage{position:relative;overflow:auto;padding:0}
.intro{padding:20px 22px 8px}
.intro h2{margin:0 0 6px;font-size:18px;letter-spacing:-.01em}
.intro .lede{color:var(--muted);max-width:78ch;margin:0 0 12px;font-size:12.5px}
.io{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 6px}
.io .chip{font-size:10.5px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--panel)}
.io .chip b{letter-spacing:.1em;text-transform:uppercase;font-size:9px;color:var(--muted);display:block;margin-bottom:2px}
.io .chip.in b{color:var(--data)} .io .chip.out b{color:var(--model)} .io .chip.run b{color:var(--service)}
.diagram-wrap{position:relative;margin:8px 12px 28px}
.diagram{position:relative}
svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.edges path{fill:none;stroke:var(--wire);stroke-width:1.6}
svg.edges path.hot{stroke-width:2.4}
.node{position:absolute;width:208px;min-height:62px;background:var(--panel);border:1px solid var(--border);
  border-left-width:3px;border-radius:10px;padding:9px 11px;cursor:pointer;z-index:2;
  transition:transform .12s,border-color .12s,box-shadow .12s}
.node:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.33)}
.node .nl{font-size:12px;font-weight:700;line-height:1.25;word-break:break-word}
.node .ns{font-size:9.5px;color:var(--muted);margin-top:3px;word-break:break-all}
.node .nt{font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:4px;display:block}
.node.sel{box-shadow:0 0 0 2px var(--fn),0 10px 26px rgba(0,0,0,.4)}
.node.dim{opacity:.32}
.node.planned{border-style:dashed}
.swim{position:absolute;left:0;top:0;height:100%;border-right:1px dashed var(--border);z-index:0}
.swimlabel{position:absolute;top:6px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:700;z-index:1;white-space:nowrap}
/* type colors */
.t-fn{border-left-color:var(--fn)} .t-fn .nt{color:var(--fn)}
.t-model{border-left-color:var(--model)} .t-model .nt{color:var(--model)}
.t-data{border-left-color:var(--data)} .t-data .nt{color:var(--data)}
.t-gate{border-left-color:var(--gate)} .t-gate .nt{color:var(--gate)}
.t-service{border-left-color:var(--service)} .t-service .nt{color:var(--service)}
.t-db{border-left-color:var(--db)} .t-db .nt{color:var(--db)}
.t-ext{border-left-color:var(--ext)} .t-ext .nt{color:var(--ext)}
.t-note{border-left-color:var(--note);border-style:dashed} .t-note .nt{color:var(--note)}
/* passport */
#passport{border-left:1px solid var(--border);background:var(--mask);padding:18px 18px 40px;
  position:sticky;top:116px;align-self:start;height:calc(100vh - 116px);overflow:auto}
#passport.empty .pp-body{display:none}
.pp-hint{color:var(--dim);font-size:11.5px;line-height:1.6;border:1px dashed var(--border);border-radius:10px;padding:14px}
#passport:not(.empty) .pp-hint{display:none}
.pp-kind{display:inline-block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  padding:3px 8px;border-radius:999px;border:1px solid var(--border);margin-bottom:10px}
.pp-title{font-size:16px;font-weight:700;line-height:1.25;margin:0 0 2px;word-break:break-word}
.pp-file{font-size:10.5px;color:var(--muted);margin:0 0 14px;word-break:break-all}
.pp-sec{margin:0 0 13px}
.pp-sec h4{margin:0 0 5px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pp-sec p{margin:0;font-size:12px;line-height:1.55}
.pp-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.pp-list li{font-size:11px;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:5px 8px}
.pp-link{cursor:pointer;color:var(--fn);text-decoration:none;border:1px solid var(--border)}
.pp-link:hover{border-color:var(--fn)}
.pp-tag{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
#legend{position:fixed;right:14px;bottom:14px;background:var(--mask);border:1px solid var(--border);
  border-radius:12px;padding:10px 12px;z-index:50;box-shadow:0 14px 40px rgba(0,0,0,.35);max-width:220px}
#legend h5{margin:0 0 7px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lg{display:flex;align-items:center;gap:7px;font-size:10.5px;margin:3px 0;color:var(--muted)}
.lg .sw{width:12px;height:12px;border-radius:3px;border-left:3px solid}
#legend.min .lgs{display:none}
#legend .lgtoggle{cursor:pointer;float:right;color:var(--dim)}
@media(max-width:860px){
  main{grid-template-columns:1fr}
  #passport{position:static;height:auto;border-left:none;border-top:1px solid var(--border)}
  #legend{display:none}
}
</style>
</head>
<body>
<header id="top">
  <div class="brand">
    <span class="sigil"></span>
    <div>
      <h1>SELF-OWNED LLM &middot; ARCHITECTURE ATLAS</h1>
      <p class="sub">From-scratch pretraining &rarr; Qwen alignment (SFT &middot; DPO &middot; SEAL) &middot; human-governed self-learning</p>
    </div>
  </div>
  <button id="themeBtn" title="Toggle light / dark">◐ theme</button>
</header>
<nav id="tabs"></nav>
<main>
  <section id="stage"></section>
  <aside id="passport" class="empty">
    <div class="pp-hint">Click any node to inspect it — file, purpose, inputs, outputs and connections.</div>
  </aside>
</main>
<div id="legend"></div>

/* ================= SEAL ================= */
{id:"seal",name:"SEAL",color:"var(--gate)",
 title:"SEAL — reward-gated self-adaptation (the self-owned loop)",
 lede:"The headline idea. For each passage the model <b>teaches itself</b>: it trains a LoRA adapter on <i>some</i> of the passage's Q&A, then <b>grades itself</b> with token-F1 on the <i>held-out</i> Q&A it never trained on. The adapter is kept only if the held-out score <b>improves</b> by ≥ accept_margin — so the system owns the decision to accept or discard its own weight update, using <i>generalization</i> (not memorization) as the test. A <b>safety gate</b> (RiskValidator) drops HIGH-risk edits before any compute — a reward improvement can never override safety. Config: holdout_frac 0.34, accept_margin 0.0, LoRA 16/32, 5 epochs, greedy 32 tokens.",
 io:{in:"data/self_adapt/squad_mini.jsonl ({passage, qa_pairs:[{q,a}]})",

{id:"hitl",name:"HITL",color:"var(--db)",

<script>
const COLW=236, ROWH=98, NW=208, PADX=28, TOPY=42;
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
let CUR=null, SEL=null, NODEMAP={};

function buildTabs(){
  const nav=$("#tabs"); nav.innerHTML="";
  ATLAS.tabs.forEach((t,i)=>{
    const b=el("button","tab"+(i===0?" active":""));
    b.innerHTML=`<span class="dot" style="background:${t.color}"></span>${t.name}`;
    b.onclick=()=>selectTab(t.id,b);
    b.dataset.id=t.id; nav.appendChild(b);
  });
}
function selectTab(id,btn){
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.id===id));
  if(!btn) btn=document.querySelector('.tab[data-id="'+id+'"]');
  CUR=ATLAS.tabs.find(t=>t.id===id);
  renderStage(CUR); clearPassport();
  $("#stage").scrollTo({top:0,left:0});
}
function clearPassport(){
  const p=$("#passport"); p.classList.add("empty");
  const b=p.querySelector(".pp-body"); if(b) b.remove();
  SEL=null;
  document.querySelectorAll(".node").forEach(n=>n.classList.remove("sel","dim"));
  document.querySelectorAll("svg.edges path").forEach(e=>e.classList.remove("hot"));
}
function renderStage(tab){
  const s=$("#stage"); s.innerHTML="";
  const intro=el("div","intro");
  intro.appendChild(el("h2",null,tab.title));
  intro.appendChild(el("p","lede",tab.lede));
  const io=el("div","io");
  io.appendChild(el("div","chip in","<b>Inputs</b>"+tab.io.in));
  io.appendChild(el("div","chip out","<b>Outputs</b>"+tab.io.out));
  io.appendChild(el("div","chip run","<b>Run</b>"+tab.io.run));
  intro.appendChild(io); s.appendChild(intro);
  const wrap=el("div","diagram-wrap"), dia=el("div","diagram");
  let maxC=0,maxR=0;
  tab.nodes.forEach(n=>{maxC=Math.max(maxC,n.c);maxR=Math.max(maxR,n.r);});
  const W=(maxC+1)*COLW+PADX, H=(maxR+1)*ROWH+TOPY+16;
  dia.style.width=W+"px"; dia.style.height=H+"px"; dia.style.minWidth=W+"px";
  (tab.swims||[]).forEach((label,c)=>{
    const x=PADX+c*COLW;
    if(c>0){const ln=el("div","swim");ln.style.left=(x-14)+"px";ln.style.height=H+"px";dia.appendChild(ln);}
    const lb=el("div","swimlabel",label); lb.style.left=x+"px"; dia.appendChild(lb);
  });
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","edges"); svg.style.width=W+"px"; svg.style.height=H+"px";
  dia.appendChild(svg);
  NODEMAP={};
  tab.nodes.forEach(n=>{
    NODEMAP[n.id]=n;
    const d=el("div","node t-"+n.t+(n.planned?" planned":""));
    d.style.left=(PADX+n.c*COLW)+"px"; d.style.top=(TOPY+n.r*ROWH)+"px";
    d.dataset.id=n.id;
    d.innerHTML=`<div class="nt">${TYPES[n.t]||n.t}</div><div class="nl">${n.l}</div><div class="ns">${n.s}</div>`;
    d.onclick=()=>selectNode(n.id);
    dia.appendChild(d);
  });
  wrap.appendChild(dia); s.appendChild(wrap);
  requestAnimationFrame(()=>drawEdges(tab,svg,dia));
}
function anchor(nodeEl,dia,side){
  const r=nodeEl.getBoundingClientRect(), d=dia.getBoundingClientRect();
  const y=r.top-d.top+r.height/2;
  return side==="r"?{x:r.left-d.left+r.width,y}:{x:r.left-d.left,y};
}
function drawEdges(tab,svg,dia){
  const NS="http://www.w3.org/2000/svg";
  tab.edges.forEach(([a,b],i)=>{
    const ea=dia.querySelector('.node[data-id="'+a+'"]'), eb=dia.querySelector('.node[data-id="'+b+'"]');
    if(!ea||!eb) return;
    const na=NODEMAP[a], nb=NODEMAP[b];
    const fwd = nb.c>=na.c;
    const p1=anchor(ea,dia,fwd?"r":"l"), p2=anchor(eb,dia,fwd?"l":"r");
    const dx=Math.max(40,Math.abs(p2.x-p1.x)*0.5);
    const path=document.createElementNS(NS,"path");
    let dstr;
    if(fwd){ dstr=`M${p1.x},${p1.y} C${p1.x+dx},${p1.y} ${p2.x-dx},${p2.y} ${p2.x},${p2.y}`; }
    else{ // back/loop edge: bow downward
      const midY=Math.max(p1.y,p2.y)+54;
      dstr=`M${p1.x},${p1.y} C${p1.x+dx},${midY} ${p2.x-dx},${midY} ${p2.x},${p2.y}`;
      path.setAttribute("stroke-dasharray","5 4");
    }
    path.setAttribute("d",dstr); path.dataset.a=a; path.dataset.b=b;
    svg.appendChild(path);
  });
}
function selectNode(id){
  const n=NODEMAP[id]; if(!n) return; SEL=id;
  const neigh=new Set([id]);
  CUR.edges.forEach(([a,b])=>{if(a===id)neigh.add(b);if(b===id)neigh.add(a);});
  document.querySelectorAll(".node").forEach(d=>{
    const nid=d.dataset.id;
    d.classList.toggle("sel",nid===id);
    d.classList.toggle("dim",!neigh.has(nid));
  });
  document.querySelectorAll("svg.edges path").forEach(p=>{
    p.classList.toggle("hot",p.dataset.a===id||p.dataset.b===id);
  });
  renderPassport(n);
}
function relList(ids,title){
  if(!ids||!ids.length) return "";
  const items=ids.map(x=>{
    const t=NODEMAP[x];
    if(t) return `<li class="pp-link" data-go="${x}">${t.l} <span class="pp-tag">${t.s}</span></li>`;
    return `<li>${x} <span class="pp-tag">external</span></li>`;
  }).join("");
  return `<div class="pp-sec"><h4>${title}</h4><ul class="pp-list">${items}</ul></div>`;
}
function renderPassport(n){
  const p=$("#passport"); p.classList.remove("empty");
  let b=p.querySelector(".pp-body"); if(b) b.remove();
  b=el("div","pp-body");
  const col={fn:"var(--fn)",model:"var(--model)",data:"var(--data)",gate:"var(--gate)",service:"var(--service)",db:"var(--db)",ext:"var(--ext)",note:"var(--note)"}[n.t];
  let html=`<span class="pp-kind" style="color:${col};border-color:${col}">${TYPES[n.t]||n.t}</span>`;
  html+=`<div class="pp-title">${n.l}</div><div class="pp-file">${n.s}</div>`;
  html+=`<div class="pp-sec"><h4>What it does</h4><p>${n.p}</p></div>`;
  if(n.i&&n.i!=="—") html+=`<div class="pp-sec"><h4>Inputs</h4><p>${n.i}</p></div>`;
  if(n.o&&n.o!=="—") html+=`<div class="pp-sec"><h4>Outputs / effects</h4><p>${n.o}</p></div>`;
  html+=relList(n.ca,"Calls →");
  html+=relList(n.cb,"← Called by");
  if(n.go) html+=`<div class="pp-sec"><button class="tab" data-tab="${n.go}" style="color:var(--fn);border-color:var(--fn)">Open the ${n.go} tab →</button></div>`;
  b.innerHTML=html; p.appendChild(b);
  b.querySelectorAll("[data-go]").forEach(li=>li.onclick=()=>selectNode(li.dataset.go));
  const gb=b.querySelector("[data-tab]"); if(gb) gb.onclick=()=>selectTab(gb.dataset.tab);
  if(window.innerWidth<=860) p.scrollIntoView({behavior:"smooth"});
}
function buildLegend(){
  const types=[["fn","function / step"],["model","nn module"],["data","data / file / table"],["gate","safety / reward gate"],["service","service · endpoint"],["db","db table"],["ext","external lib / model"],["note","variant / planned"]];
  const L=$("#legend");
  L.innerHTML=`<h5>Legend <span class="lgtoggle">▾</span></h5><div class="lgs">`+
    types.map(([k,v])=>`<div class="lg"><span class="sw" style="border-left-color:var(--${k});background:var(--panel)"></span>${v}</div>`).join("")+
    `</div>`;
  L.querySelector(".lgtoggle").onclick=()=>L.classList.toggle("min");
}
$("#themeBtn").onclick=()=>{
  const r=document.documentElement;
  r.setAttribute("data-theme", r.getAttribute("data-theme")==="dark"?"light":"dark");
  if(CUR) renderStage(CUR); // redraw edges with new colors
  if(SEL) selectNode(SEL);
};
window.addEventListener("resize",()=>{if(CUR){const sv=document.querySelector("svg.edges");const dia=document.querySelector(".diagram");if(sv&&dia){sv.innerHTML="";drawEdges(CUR,sv,dia);if(SEL)selectNode(SEL);}}});
buildTabs(); buildLegend();
(function initFromHash(){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  const [tabId,nodeId]=h.split("/");
  const t=ATLAS.tabs.find(x=>x.id===tabId);
  selectTab(t?t.id:ATLAS.tabs[0].id);
  if(nodeId&&NODEMAP[nodeId]) requestAnimationFrame(()=>selectNode(nodeId));
})();
</script>
